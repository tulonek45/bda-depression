# Base URL for downloading NHANES data files
data_base_url: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/{}.xpt

# Path to store the data files
data_path: data

# Mapping of dataset names to their corresponding data files
datafiles:
  - DPQ_L
  - DEMO_L
  - BMX_L
  - SLQ_L
  - SMQ_L
  - MCQ_L
  - ALQ_L
  - PAQ_L

# The PHQ dataset and attributes to be used for depression assessment
phq_dataset: DPQ_L
phq_attributes:
  - DPQ010
  - DPQ020
  - DPQ030
  - DPQ040
  - DPQ050
  - DPQ060
  - DPQ070
  - DPQ080
  - DPQ090

# Selected attributes for each dataset
selected_attributes:
  DEMO_L:
    - RIDAGEYR
    - RIAGENDR
    - INDFMPIR
    - SDMVSTRA
    - SDMVPSU
  BMX_L:
    - BMXBMI
    - BMXWAIST
  SLQ_L:
    - SLD012
    - SLD013
  SMQ_L:
    - SMQ020
    - SMQ040
  MCQ_L:
    - MCQ160B
    - MCQ160C
    - MCQ160E
    - MCQ220
  ALQ_L:
    - ALQ111
    - ALQ121
    - ALQ130
  PAQ_L:
    - PAD810Q
    - PAD810U
    - PAD680

# Refused and unknown codes apply only to these questionnaire variables.
missing_codes:
  SMQ020:
    - 7
    - 9
  SMQ040:
    - 7
    - 9
  MCQ160B:
    - 7
    - 9
  MCQ160C:
    - 7
    - 9
  MCQ160E:
    - 7
    - 9
  MCQ220:
    - 7
    - 9
  ALQ111:
    - 7
    - 9
  ALQ121:
    - 77
    - 99
  ALQ130:
    - 777
    - 999
  PAD810Q:
    - 7777
    - 9999
  PAD680:
    - 7777
    - 9999

# Cutoffs for depression severity based on PHQ scores
depression_cutoffs:
  - min: 0
    max: 9
    label: not_depressed
    label_int: 0
  - min: 10
    max: 27
    label: depressed
    label_int: 1

# Map ALQ121 response codes to representative drinking days per year
alcohol_days_per_year:
  0: 0
  1: 365
  2: 312
  3: 182
  4: 104
  5: 52
  6: 30
  7: 12
  8: 9
  9: 4.5
  10: 1.5

numeric_columns:
  - depression_status_int
  - RIDAGEYR
  - RIAGENDR
  - INDFMPIR
  - sleep_hours
  - vigorous_act
  - sedentary_minutes
  - alcohol_drinks_week
  - smoking_former
  - smoking_current
  - SDMVSTRA
  - SDMVPSU
